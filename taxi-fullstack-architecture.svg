<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="520" viewBox="0 0 1500 520" role="img" aria-labelledby="title desc">
<title id="title">Taxi Prediction Full Stack — System Architecture</title><desc id="desc">Taxi prediction architecture: Streamlit collects trip inputs, OpenRouteService provides geocoding and driving route context, FastAPI serves a scikit-learn regression pipeline, and the UI presents the predicted fare with a Folium map. GitHub Actions trains the model and tests the API.</desc>
