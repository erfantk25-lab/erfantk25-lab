<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">Taxi price prediction full-stack architecture</title>
<desc id="desc">A Streamlit application uses OpenRouteService to obtain route information, sends trip features to a FastAPI service running a saved scikit-learn pipeline, and displays the predicted fare and Folium route map.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050F1E"/><stop offset="1" stop-color="#102B49"/></linearGradient>
  <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#8CA3B8" stroke-opacity=".08"/></pattern>
  <style>
    .eyebrow{font:600 12px monospace;letter-spacing:2px;fill:#42D9F5}
    .head{font:700 17px Arial,sans-serif;fill:#F2F7FC}
    .sub{font:12px Arial,sans-serif;fill:#B8CADD}
    .node{fill:#0B1D32;stroke:#2A5577;stroke-width:1.5}
    .arrow{fill:none;stroke:#42D9F5;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
  </style>
</defs>
<rect width="1200" height="360" rx="18" fill="url(#bg)"/><rect width="1200" height="360" rx="18" fill="url(#grid)"/>
<text x="42" y="42" class="eyebrow">02 / TAXI PRICE PREDICTION · FULL-STACK SYSTEM</text>
<text x="42" y="68" class="sub">Route enrichment → API inference → fare prediction and map visualization</text>

<g transform="translate(40 112)">
  <rect class="node" width="198" height="122" rx="12"/>
  <rect width="198" height="4" rx="2" fill="#42D9F5"/>
  <text x="18" y="36" class="head">STREAMLIT UI</text>
  <text x="18" y="62" class="sub">Pickup + drop-off</text>
  <text x="18" y="82" class="sub">Passenger + fare inputs</text>
  <text x="18" y="104" class="sub">Trip request</text>
  <path d="M201 61H236L248 61" class="arrow"/><path d="M241 54L249 61L241 68" class="arrow"/>
</g>
<g transform="translate(290 112)">
  <rect class="node" width="198" height="122" rx="12"/>
  <rect width="198" height="4" rx="2" fill="#42D9F5"/>
  <text x="18" y="36" class="head">OPENROUTESERVICE</text>
  <text x="18" y="62" class="sub">Geocoding + driving route</text>
  <text x="18" y="82" class="sub">Distance + duration</text>
  <text x="18" y="104" class="sub">External route data</text>
  <path d="M201 61H236L248 61" class="arrow"/><path d="M241 54L249 61L241 68" class="arrow"/>
</g>
<g transform="translate(540 112)">
  <rect class="node" width="198" height="122" rx="12"/>
  <rect width="198" height="4" rx="2" fill="#42D9F5"/>
  <text x="18" y="36" class="head">FASTAPI</text>
  <text x="18" y="62" class="sub">POST /predict</text>
  <text x="18" y="82" class="sub">Trip feature payload</text>
  <text x="18" y="104" class="sub">REST inference endpoint</text>
  <path d="M201 61H236L248 61" class="arrow"/><path d="M241 54L249 61L241 68" class="arrow"/>
</g>
<g transform="translate(790 112)">
  <rect class="node" width="174" height="122" rx="12"/>
  <rect width="174" height="4" rx="2" fill="#42D9F5"/>
  <text x="18" y="36" class="head">MODEL</text>
  <text x="18" y="62" class="sub">scikit-learn</text>
  <text x="18" y="82" class="sub">Regression pipeline</text>
  <text x="18" y="104" class="sub">Joblib artifact</text>
  <path d="M177 61H207L219 61" class="arrow"/><path d="M212 54L220 61L212 68" class="arrow"/>
</g>
<g transform="translate(1010 112)">
  <rect width="150" height="122" rx="12" fill="#0B1D32" stroke="#42D9F5" stroke-width="1.5"/>
  <rect width="150" height="4" rx="2" fill="#42D9F5"/>
  <text x="18" y="36" class="head">PREDICTION</text>
  <text x="18" y="62" class="sub">Predicted fare</text>
  <text x="18" y="82" class="sub">SEK response</text>
  <text x="18" y="104" class="sub">Returned to UI</text>
</g>

<path d="M139 234V273H390" fill="none" stroke="#42D9F5" stroke-width="2" stroke-dasharray="6 6"/>
<path d="M390 273V246" fill="none" stroke="#42D9F5" stroke-width="2" stroke-dasharray="6 6"/>
<g transform="translate(390 246)">
  <rect width="420" height="82" rx="12" fill="#0B1D32" stroke="#2A5577" stroke-width="1.5"/>
  <text x="22" y="31" class="head">FOLIUM ROUTE MAP</text>
  <text x="22" y="54" class="sub">Interactive geographic view rendered in the Streamlit experience</text>
  <text x="22" y="72" font-family="monospace" font-size="10" fill="#42D9F5">VISUALIZATION LAYER</text>
</g>
<text x="840" y="286" font-family="monospace" font-size="11" fill="#8CA3B8">AUTOMATED CI</text>
<text x="840" y="306" class="sub">Train model · API tests · GitHub Actions</text>
</svg>