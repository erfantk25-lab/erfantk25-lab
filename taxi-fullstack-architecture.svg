  <radialGradient id="glow"><stop offset="0" stop-color="#4a6cff" stop-opacity=".34"/><stop offset="1" stop-color="#4a6cff" stop-opacity="0"/></radialGradient>
  <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="16"/></filter>
  <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#89a9ff" stroke-opacity=".075" stroke-width="1"/></pattern>
</defs>
