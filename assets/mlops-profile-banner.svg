<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="552" viewBox="0 0 1600 552" role="img" aria-labelledby="title desc">
<title id="title">Erfan Tahmasebi — MLOps Engineering</title>
<desc id="desc">Dark navy and electric cyan MLOps banner with a data, train, serve and monitor pipeline, network brain artwork and technology labels.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#020b17"/><stop offset=".52" stop-color="#061b32"/><stop offset="1" stop-color="#092d49"/></linearGradient>
  <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00d4ff"/><stop offset="1" stop-color="#36a2ff"/></linearGradient>
  <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00a9e8" stop-opacity=".06"/><stop offset=".5" stop-color="#00d8ff" stop-opacity=".7"/><stop offset="1" stop-color="#268aff" stop-opacity=".08"/></linearGradient>
  <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" fill="none" stroke="#80c8ed" stroke-opacity=".09" stroke-width="1"/></pattern>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1600" height="552" rx="25" fill="url(#bg)"/>
<rect width="1600" height="552" rx="25" fill="url(#grid)"/>
