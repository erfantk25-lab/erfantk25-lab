      <text x="246" y="22" text-anchor="middle" fill="#a9f0df" font-size="13" font-weight="650">CI/CD · DOCKER</text>
      <rect x="338" width="148" height="34" rx="17" fill="#183b52" stroke="#3a7f8c"/>
      <text x="412" y="22" text-anchor="middle" fill="#a9f0df" font-size="13" font-weight="650">KUBERNETES</text>
    </g>
  </g>
  <g transform="translate(690 66)" font-family="Inter,Segoe UI,Arial,sans-serif">
