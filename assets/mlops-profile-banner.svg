<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Erfan Tahmasbi — MLOps Engineering</title>
  <desc id="desc">A dark technical banner showing a machine learning workflow from data to training, serving and monitoring.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081426"/>
      <stop offset="0.55" stop-color="#102b46"/>
      <stop offset="1" stop-color="#123d55"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#55d6be"/>
      <stop offset="1" stop-color="#65a9ff"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#b5d7ef" stroke-opacity=".075" stroke-width="1"/>
    </pattern>
    <filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="320" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="24" fill="url(#grid)"/>
  <circle cx="1060" cy="60" r="170" fill="#4ec9c0" opacity=".07"/>
  <circle cx="820" cy="300" r="180" fill="#568cff" opacity=".08"/>
  <path d="M0 260 C220 195 340 330 560 250 S900 180 1200 240" fill="none" stroke="#67c9d5" stroke-opacity=".16" stroke-width="2"/>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="68" y="78" fill="#82e4d2" font-size="16" font-weight="700" letter-spacing="3">MLOPS ENGINEERING</text>
    <text x="68" y="143" fill="#f4f8ff" font-size="46" font-weight="750">ERFAN TAHMASBI</text>
    <text x="70" y="184" fill="#c1d4e8" font-size="20">Reliable machine-learning systems, from experiments to services</text>
    <g transform="translate(70 226)">
