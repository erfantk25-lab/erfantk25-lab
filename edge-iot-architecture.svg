<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
<title id="title">Smart Grow Edge IoT architecture</title>
<desc id="desc">A Raspberry Pi Pico W reads temperature, humidity and light sensors, checks thresholds locally and triggers local alarms, then sends MQTT telemetry through Mosquitto to a Python consumer, TimescaleDB and Grafana, with Discord alerts.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050F1E"/><stop offset="1" stop-color="#102B49"/></linearGradient>
  <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#8CA3B8" stroke-opacity=".08"/></pattern>
  <style>
    .eyebrow{font:600 12px monospace;letter-spacing:2px;fill:#42D9F5}
    .head{font:700 16px Arial,sans-serif;fill:#F2F7FC}
    .sub{font:12px Arial,sans-serif;fill:#B8CADD}
    .tiny{font:11px monospace;fill:#8CA3B8}
    .node{fill:#0B1D32;stroke:#2A5577;stroke-width:1.5}
    .arrow{fill:none;stroke:#42D9F5;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
  </style>
</defs>
<rect width="1200" height="380" rx="18" fill="url(#bg)"/><rect width="1200" height="380" rx="18" fill="url(#grid)"/>
<text x="42" y="42" class="eyebrow">03 / πCO SMART GROW · EDGE IOT TELEMETRY</text>
<text x="42" y="68" class="sub">Local threshold decisions continue on the device while telemetry flows to the monitoring stack</text>

