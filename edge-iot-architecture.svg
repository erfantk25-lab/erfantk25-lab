  <rect class="node" width="188" height="120" rx="12"/><rect width="188" height="4" rx="2" fill="#42D9F5"/>
  <text x="16" y="35" class="head">EDGE LOGIC</text>
  <text x="16" y="60" class="sub">Local threshold checks</text>
  <text x="16" y="81" class="sub">Wi-Fi · JSON / MQTT</text>
  <text x="16" y="102" class="sub">On-device decisions</text>
  <path d="M191 60H222L234 60" class="arrow"/><path d="M227 53L235 60L227 67" class="arrow"/>
</g>
