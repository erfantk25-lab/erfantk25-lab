<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="520" viewBox="0 0 1500 520" role="img" aria-labelledby="title desc">
<title id="title">Smart Grow Edge IoT — System Architecture</title><desc id="desc">Smart Grow Edge IoT architecture: a Raspberry Pi Pico W reads temperature, humidity and light sensors, applies local threshold logic for buzzer and LED alerts, publishes telemetry over Wi-Fi through Mosquitto MQTT, and a Python consumer writes readings to TimescaleDB for Grafana dashboards and Discord webhook alerts. A Wokwi digital twin supports simulation.</desc>
