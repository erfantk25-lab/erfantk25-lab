  <text x="16" y="60" class="sub">MQTT broker</text>
  <text x="16" y="81" class="sub">Telemetry ingestion</text>
  <text x="16" y="102" class="sub">QoS 1</text>
  <path d="M177 60H209L221 60" class="arrow"/><path d="M214 53L222 60L214 67" class="arrow"/>
</g>
<g transform="translate(744 108)">
  <rect class="node" width="174" height="120" rx="12"/><rect width="174" height="4" rx="2" fill="#42D9F5"/>
  <text x="16" y="35" class="head">PYTHON</text>
  <text x="16" y="60" class="sub">MQTT consumer</text>
  <text x="16" y="81" class="sub">DB ingestion</text>
  <text x="16" y="102" class="sub">Discord webhook</text>
  <path d="M177 60H209L221 60" class="arrow"/><path d="M214 53L222 60L214 67" class="arrow"/>
</g>
