  <rect class="node" width="188" height="120" rx="12"/><rect width="188" height="4" rx="2" fill="#42D9F5"/>
  <text x="16" y="35" class="head">PICO W</text>
  <text x="16" y="60" class="sub">DHT11 · APDS-9999</text>
  <text x="16" y="81" class="sub">Temperature · humidity</text>
  <text x="16" y="102" class="sub">Light sensor readings</text>
  <path d="M191 60H222L234 60" class="arrow"/><path d="M227 53L235 60L227 67" class="arrow"/>
</g>
