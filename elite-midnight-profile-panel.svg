<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="190" viewBox="0 0 1200 190" role="img" aria-labelledby="t d">
<title id="t">Engineering profile — Elite Midnight</title>
<desc id="d">A navy and cyan profile panel showing the machine learning engineering lifecycle from data to deployment and monitoring.</desc>
<defs>
  <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#050F1E"/><stop offset="1" stop-color="#0A1D33"/></linearGradient>
  <radialGradient id="glow"><stop stop-color="#42D9F5" stop-opacity=".20"/><stop offset="1" stop-color="#42D9F5" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#8CA3B8" stroke-opacity=".09"/></pattern>
  <style>
    .eyebrow{font:600 12px monospace;letter-spacing:3px;fill:#42D9F5}
    .title{font:700 31px Arial,sans-serif;letter-spacing:-.7px;fill:#F2F7FC}
    .sub{font:15px Arial,sans-serif;fill:#B8CADD}
    .tag{font:600 10px monospace;letter-spacing:1px;fill:#DCEAF4}
  </style>
</defs>
<rect width="1200" height="190" rx="18" fill="url(#bg)"/><rect width="1200" height="190" rx="18" fill="url(#grid)"/>
<ellipse cx="1010" cy="90" rx="340" ry="210" fill="url(#glow)"/>
<rect x="1" y="1" width="1198" height="188" rx="17" fill="none" stroke="#2A5577" stroke-opacity=".65"/>
<rect x="42" y="34" width="4" height="22" rx="2" fill="#42D9F5"/>
<text x="60" y="50" class="eyebrow">ENGINEERING PROFILE / ELITE MIDNIGHT</text>
<text x="42" y="101" class="title">RELIABLE ML SYSTEMS.</text>
<text x="44" y="130" class="sub">From validated data and model training to APIs, containers and operations.</text>
<g transform="translate(44 151)" class="tag">
  <text x="0" y="0">DATA QUALITY</text><circle cx="103" cy="-4" r="2.5" fill="#42D9F5"/>
  <text x="119" y="0">MODEL LIFECYCLE</text><circle cx="244" cy="-4" r="2.5" fill="#42D9F5"/>
  <text x="260" y="0">DELIVERY</text>
</g>
<g transform="translate(700 53)">
  <text x="0" y="-12" class="eyebrow">ML LIFECYCLE</text>
  <path d="M58 48H424" stroke="#42D9F5" stroke-opacity=".65" stroke-width="2" stroke-dasharray="5 7"/>
  <g fill="#0B1D32" stroke="#42D9F5" stroke-width="1.6">
    <rect x="0" y="20" width="112" height="64" rx="10"/><rect x="134" y="20" width="112" height="64" rx="10"/><rect x="268" y="20" width="112" height="64" rx="10"/><rect x="402" y="20" width="112" height="64" rx="10"/>
  </g>
  <g fill="#F2F7FC" font-family="monospace" font-size="12" text-anchor="middle">
    <text x="56" y="48">DATA</text><text x="56" y="66" fill="#8CA3B8" font-size="9">VALIDATE</text>
    <text x="190" y="48">MODEL</text><text x="190" y="66" fill="#8CA3B8" font-size="9">TRAIN</text>
    <text x="324" y="48">SERVICE</text><text x="324" y="66" fill="#8CA3B8" font-size="9">DEPLOY</text>
    <text x="458" y="48">OPS</text><text x="458" y="66" fill="#8CA3B8" font-size="9">OBSERVE</text>
  </g>
  <g fill="#42D9F5"><circle cx="56" cy="20" r="3"/><circle cx="190" cy="20" r="3"/><circle cx="324" cy="20" r="3"/><circle cx="458" cy="20" r="3"/></g>
</g>
</svg>