  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f5d77b"/><stop offset=".55" stop-color="#f0b84f"/><stop offset="1" stop-color="#d98a45"/></linearGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1b3461"/><stop offset="1" stop-color="#27194d"/></linearGradient>
  <radialGradient id="glow"><stop offset="0" stop-color="#d69b45" stop-opacity=".26"/><stop offset="1" stop-color="#d69b45" stop-opacity="0"/></radialGradient>
  <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="12"/></filter>
  <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#89a9ff" stroke-opacity=".08"/></pattern>
</defs>
<rect width="1500" height="320" rx="26" fill="url(#bg)"/>
<rect width="1500" height="320" rx="26" fill="url(#grid)"/>
<ellipse cx="1195" cy="154" rx="355" ry="235" fill="url(#glow)"/>
