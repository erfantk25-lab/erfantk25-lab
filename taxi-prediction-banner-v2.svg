<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="320" viewBox="0 0 1500 320" role="img" aria-labelledby="title desc">
<title id="title">Taxi Prediction — Full-stack Machine Learning</title>
<desc id="desc">A dark navy and violet project banner matching the portfolio series, with a dedicated taxi illustration on the left and a route prediction dashboard on the right.</desc>
<defs>
