<path d="M0 286C205 228 345 327 540 288s315-54 495-16 330 26 465-40" fill="none" stroke="url(#accent)" stroke-width="2.5" opacity=".55"/>
<g font-family="Inter,Segoe UI,Arial,sans-serif">
