<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="400" viewBox="0 0 1500 400" role="img" aria-labelledby="title desc">
<title id="title">Erfan Tahmasebi — MLOps Engineering</title>
<desc id="desc">A refined dark navy and violet portfolio banner matching the project's visual identity, with a machine learning lifecycle illustration.</desc>
<defs>
