<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="320" viewBox="0 0 1500 320" role="img" aria-labelledby="title desc">
<title id="title">Erfan Tahmasebi — MLOps Engineering</title>
<desc id="desc">A portfolio banner for MLOps engineering, highlighting reliable machine learning systems, automation and delivery.</desc>
<defs>
