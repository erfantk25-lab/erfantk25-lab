<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="320" viewBox="0 0 1500 320" role="img" aria-labelledby="title desc">
<title id="title">Smart Grow — Edge Computing and Environmental Monitoring</title>
<desc id="desc">A collaborative edge computing and IoT project monitoring environmental conditions with connected sensors and telemetry.</desc>
