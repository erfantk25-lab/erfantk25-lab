<title id="title">Smart Grow — Edge Computing and IoT</title>
<desc id="desc">Smart Grow uses local environmental sensors, connected alerts, MQTT telemetry and Grafana monitoring.</desc>

<!-- Plant and connected-sensor mark, in the Study Buddy emblem position -->
<g transform="translate(76 74)" stroke-linecap="round" stroke-linejoin="round">
  <path d="M91 75v72" stroke="#66d6ab" stroke-width="6"/>
  <path d="M91 105C33 105 17 62 28 32 68 31 91 60 91 105Z" fill="#287e9b" stroke="url(#accent)" stroke-width="4.5"/>
  <path d="M91 84C106 27 158 15 181 39 176 80 136 107 91 84Z" fill="#2aaf92" stroke="url(#accent)" stroke-width="4.5"/>
  <path d="M90 143C56 130 34 145 27 173h128c-7-28-29-43-65-30Z" fill="#153765" stroke="#8aa6ff" stroke-width="4"/>
  <path d="M34 173h114l-13 23H47Z" fill="#122c55" stroke="#8aa6ff" stroke-width="3.5"/>
  <path d="M15 20q-13-17 0-34M37 13q-13-17 0-34" fill="none" stroke="#53dcff" stroke-width="3.5"/>
  <circle cx="15" cy="-19" r="5" fill="#49d9f5"/><circle cx="37" cy="-26" r="5" fill="#b36bff"/>
</g>

<!-- Study Buddy typography grid: identical hierarchy and baseline spacing -->
<g font-family="Inter,Segoe UI,Arial,sans-serif">
  <text x="315" y="132" font-size="66" font-weight="750" fill="#f5f8ff">Smart</text>
  <text x="505" y="132" font-size="66" font-weight="750" fill="url(#accent)">Grow</text>
  <text x="318" y="180" font-size="25" font-weight="500" fill="#dbe7ff">Sense  ·  Alert  ·  Stream  ·  Visualize</text>
  <rect x="318" y="205" width="430" height="2" rx="1" fill="url(#accent)" opacity=".85"/>
  <text x="318" y="244" font-size="20" fill="#aebfdf">Connected sensing for smarter growing</text>
  <text x="318" y="274" font-size="15" letter-spacing="2.1" fill="#6edcf7">PICO W  •  MQTT  •  TIMESCALEDB  •  GRAFANA</text>
</g>

