<title id="title">Customer Churn MLOps — System Architecture</title><desc id="desc">Customer churn MLOps architecture: data passes Pandera schema and drift checks, a scikit-learn model is trained and evaluated behind threshold and regression gates, optional MLflow tracks the model, and a checksum-verified artifact is served through FastAPI in Docker with GitHub Actions CI.</desc>
