<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
<title id="title">Customer Churn MLOps architecture</title>
<desc id="desc">Data validation and tests lead to model training, evaluation and regression gates, MLflow registration, Docker packaging and a FastAPI prediction service.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#102B49"/></linearGradient>
  <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#42D9F5"/><stop offset="1" stop-color="#1769AA"/></linearGradient>
  <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#8CA3B8" stroke-opacity=".08"/></pattern>
  <style>
    .eyebrow{font:600 12px monospace;letter-spacing:2px;fill:#42D9F5}
    .head{font:700 16px Arial,sans-serif;fill:#F2F7FC}
    .sub{font:12px Arial,sans-serif;fill:#B8CADD}
    .tiny{font:11px monospace;fill:#8CA3B8}
    .node{fill:#0B1D32;stroke:#2A5577;stroke-width:1.5}
    .arrow{fill:none;stroke:url(#cyan);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
  </style>
</defs>
<rect width="1200" height="390" rx="18" fill="url(#bg)"/>
<rect width="1200" height="390" rx="18" fill="url(#grid)"/>
<text x="42" y="40" class="eyebrow">01 / CUSTOMER CHURN MLOPS · DELIVERY WORKFLOW</text>
<text x="42" y="67" class="sub">Automated checks gate training, evaluation, registration and container packaging</text>

