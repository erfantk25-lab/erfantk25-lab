<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="320" viewBox="0 0 1500 320" role="img" aria-labelledby="title desc">
<title id="title">TAXI PREDICTION  /  INFERENCE DATA FLOW</title><desc id="desc">Route information and trip inputs feed the regression API; fare estimates return to the map interface.</desc>
